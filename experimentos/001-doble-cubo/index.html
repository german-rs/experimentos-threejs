<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Experimento 001 · Doble Cubo</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }

      #titulo {
        position: absolute;
        top: 30px;
        left: 0;
        width: 100%;
        text-align: center;
        margin: 0;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 2rem;
        z-index: 10;
        pointer-events: none;
      }

            #nav {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 200px;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        padding-top: 80px;
        box-sizing: border-box;
        z-index: 20;
        font-family: Arial, Helvetica, sans-serif;
      }

      #nav a {
        color: #ffffff;
        text-decoration: none;
        padding: 14px 20px;
        font-size: 0.95rem;
        border-left: 3px solid transparent;
        transition: background 0.2s, border-color 0.2s;
      }

      #nav a:hover {
        background: rgba(255, 255, 255, 0.08);
        border-left-color: #00ffcc;
      }

      #nav a.activo {
        border-left-color: #00ffcc;
        background: rgba(255, 255, 255, 0.05);
      }

    </style>
  </head>
  <body>
    <h1 id="titulo">Experimento 001 · Doble Cubo</h1>
    
    <div id="nav-root"></div>
    
    <script type="module" src="./main.js"></script>
    <script type="module" src="/src/main-nav-001.jsx"></script>
  </body>
</html>
